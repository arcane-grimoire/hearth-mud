# Scaffolding — see system/system.toml. The vendor's stock table is the one
# from the cookbook's Vendors section.
area = "town"

[[rooms]]
key = "tavern"
title = "The Stag and Crown"
description = "A low-beamed tavern."

[[objects]]
key = "vendor"
kind = "item"
title = "a brass vending machine"
description = "A brass contraption with a slot and a hand-lettered menu."
location = "tavern"
script = "vendor.luau"

[objects.attrs]
currency = "coins"

[objects.attrs.stock]
soda    = { cost = 10, title = "a bottle of fizzy soda", desc = "Cold and faintly medicinal." }
popcorn = { cost = 20, title = "a bag of popcorn", desc = "Warm, salty, over-buttered." }

# The jukebox — a tick/after-driven recipe, testable now that .session can
# advance the heartbeat.
[[objects]]
key = "jukebox"
kind = "item"
title = "a chrome jukebox"
description = "Lit from within, humming faintly."
location = "tavern"
script = "jukebox.luau"

[[objects.attrs.songs]]
title = "Ride of the Valkyries"
artist = "the house band"
lines = [
  "The horns come in like weather.",
  "Somebody at the bar starts conducting.",
]

[[objects.attrs.songs]]
title = "Slow Rain"
artist = "Merridy Vane"
lines = [
  "A brushed snare, and Vane's voice under it.",
  "Conversation drops a half-step.",
]
