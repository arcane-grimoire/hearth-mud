# Demo compute-only WASM plugin for Hearth: a deterministic, seedable
# order-2 character Markov name generator. Compiled to
# `wasm32-unknown-unknown` and dropped into a game's `world/wasm/names.wasm`;
# callable from Luau as `wasm_call("names", "generate", { seed = 1, kind = "elf" })`.
#
# Standalone crate (empty [workspace] below) so it never joins the engine's
# build — see plugins/names/README.md for the build command.
[package]
name = "names"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

[workspace]
