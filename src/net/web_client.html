<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearth MUD</title>
<style>
  :root { --bg: #1a1a2e; --fg: #e0e0e0; --input-bg: #16213e; --accent: #e94560; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: 'Courier New', monospace; height: 100vh; display: flex; flex-direction: column; }
  #output { flex: 1; overflow-y: auto; padding: 12px; white-space: pre-wrap; word-wrap: break-word; font-size: 14px; line-height: 1.5; }
  #input-bar { display: flex; border-top: 1px solid #333; }
  #input { flex: 1; background: var(--input-bg); color: var(--fg); border: none; padding: 10px 12px; font-family: inherit; font-size: 14px; outline: none; }
  #input:focus { background: #1a1a3e; }
  #send { background: var(--accent); color: white; border: none; padding: 10px 18px; cursor: pointer; font-family: inherit; font-size: 14px; }
  #status { padding: 4px 12px; font-size: 11px; color: #666; background: #111; }
</style>
</head>
<body>
<div id="output"></div>
<div id="status">Connecting...</div>
<div id="input-bar">
  <input id="input" type="text" autocomplete="off" autofocus placeholder="Enter command...">
  <button id="send">Send</button>
</div>
<script>
const output = document.getElementById('output');
const input = document.getElementById('input');
const status = document.getElementById('status');
const history = [];
let histIdx = -1;

const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
const ws = new WebSocket(`${proto}//${location.host}/ws`);

ws.onopen = () => { status.textContent = 'Connected'; };
ws.onclose = () => { status.textContent = 'Disconnected'; append('\n[Connection closed]\n'); };
ws.onerror = () => { status.textContent = 'Error'; };
ws.onmessage = (e) => { append(e.data); };

function append(text) {
  // Strip telnet IAC sequences
  text = text.replace(/[\xff][\xfb-\xfe][\x00-\xff]/g, '');
  if (!text) return;
  output.textContent += text;
  output.scrollTop = output.scrollHeight;
}

function send() {
  const cmd = input.value;
  if (cmd && ws.readyState === WebSocket.OPEN) {
    ws.send(cmd);
    history.unshift(cmd);
    if (history.length > 100) history.pop();
    histIdx = -1;
  }
  input.value = '';
}

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { send(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (histIdx < history.length - 1) { histIdx++; input.value = history[histIdx]; } }
  else if (e.key === 'ArrowDown') { e.preventDefault(); if (histIdx > 0) { histIdx--; input.value = history[histIdx]; } else { histIdx = -1; input.value = ''; } }
});
document.getElementById('send').addEventListener('click', send);
</script>
</body>
</html>
