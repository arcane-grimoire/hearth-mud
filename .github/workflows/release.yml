name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # Gate: the tag, Cargo.toml, and CHANGELOG.md must agree before anything
  # publishes. Everything below needs this, so a release that skipped its
  # changelog entry ships no binaries, no GitHub release, and no ghcr image.
  # Same script `just release-check` runs locally, so the answer can't differ.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check-release.sh "${GITHUB_REF_NAME}"

  build:
    needs: guard
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: hearth-mud-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: hearth-mud-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: hearth-mud-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: hearth-mud-macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build web client
        run: |
          cd web
          npm ci
          npm run build

      - name: Build release binary
        run: cargo build --release --features bundle-web --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/hearth-mud dist/${{ matrix.name }}
          cp LICENSE dist/
          cd dist
          tar czf ${{ matrix.name }}.tar.gz ${{ matrix.name }} LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.tar.gz

  docker:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: [build, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Only the build job's binaries. Without a pattern this also pulls
          # the .dockerbuild provenance artifact that docker/build-push-action
          # uploads on its own, which fails to extract under merge-multiple.
          pattern: hearth-mud-*
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*.tar.gz
